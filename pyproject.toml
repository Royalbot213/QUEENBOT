[project]
name = "QUEENBOT"
version = "1.0.0"
description = "A powerful Telegram Music Bot for Group Voice Chats"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["telegram", "music-bot", "voice-chat", "python"]

dependencies = [
    "motor==2.3.0",
    "pymongo==3.12.3",
    "dnspython==2.1.0",
    "python-dotenv==1.0.0",
]

[project.urls]
Homepage = "https://github.com/Royalbot213/QUEENBOT"
Repository = "https://github.com/Royalbot213/QUEENBOT"
